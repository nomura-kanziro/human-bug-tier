services:
  - type: web
    name: human-bug-tier
    env: node
    # backend 폴더를 루트로 설정 (추천)
    # frontend 정적 파일은 backend/server.js에서 __dirname 기준 상위로 서빙함
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    autoDeploy: true
    envVars:
      - key: MONGO_URI
        sync: false
      - key: ADMIN_INPUT_ID
        sync: false
      - key: ADMIN_INPUT_PW
        sync: false
      - key: JWT_SECRET
        sync: false
        generateValue: true
      # 비밀번호 찾기·가입 인증 메일용. Render는 SMTP(465/587) 아웃바운드 포트를 막아둘 수 있어
      # 1순위: Brevo(https://brevo.com) — 발신자 이메일 1개만 클릭 인증하면 도메인 없이도 임의 수신자에게 발송 가능 (가장 간편, 적극 권장)
      - key: BREVO_API_KEY
        sync: false
      # Brevo에서 인증한 발신 이메일. 미설정 시 EMAIL_USER로 대체됨.
      - key: BREVO_FROM
        sync: false
      # 2순위: Resend(https://resend.com) — 도메인 인증 전에는 계정 소유자 본인에게만 발송 가능
      - key: RESEND_API_KEY
        sync: false
      # Resend 도메인 미인증 시 기본값 onboarding@resend.dev 사용 (미설정 시 자동 적용)
      - key: RESEND_FROM
        sync: false
      # 3순위: Gmail SMTP (앱 비밀번호). Render가 SMTP를 막으면 동작 안 함 → 위 둘 중 하나 권장.
      # sync: false = Render 대시보드에서 직접 값을 입력해야 함 (이 파일은 값을 채워주지 않음).
      # 확인: 배포 후 /health 의 emailProvider를 확인.
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      # 메일 본문 절대 링크. 미설정 시 RENDER_EXTERNAL_URL(자동 주입) → 요청 Host 순으로 대체되므로 선택사항.
      - key: APP_URL
        sync: false
      # 유튜브 커뮤니티(@humanbug_univ./posts) → 새 소식 자동 연동. 미설정 시 기본 켜짐.
      - key: YOUTUBE_POSTS_SYNC_ENABLED
        sync: false
      - key: YOUTUBE_POSTS_URL
        sync: false
      - key: YOUTUBE_POSTS_POLL_MS
        sync: false
