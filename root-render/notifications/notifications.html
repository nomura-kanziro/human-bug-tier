<!--
  알림 전체보기 페이지.
  헤더의 알림 벨(🔔) 드롭다운은 최근 50건만 보여주는 "미리보기"이고(common.js의
  renderNotificationBell 계열 함수 참고), 여기는 그 알림들을 탭 4개 + 정렬 필터로
  전부 훑어볼 수 있는 상세 페이지다. 실제 데이터 로드/렌더/클릭 시 이동(딥링크) 로직은
  전부 notifications.js에 있고, 이 HTML은 골격(탭/셀렉트/목록 컨테이너)만 제공한다.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 라이트/다크 테마 FOUC(첫 렌더링 깜빡임) 방지: CSS가 로드되기 전에 즉시
       <html data-theme="light|dark">를 정해둔다. 저장된 값이 없으면(한 번도 토글을
       안 눌렀으면) 현재 시각 기준 자동값(오전 7시~밤 10시 전=라이트, 그 외=다크)을 쓴다.
       상세 로직/토글 클릭 처리는 theme.js 참고. -->
  <script>(function(){try{var t=localStorage.getItem('hbtTheme');if(t!=='light'&&t!=='dark'){var h=new Date().getHours();t=(h>=7&&h<22)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="../theme.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알림 - 휴버대 티어표</title>
  <!-- common.css/Header_Footer.css: 헤더·푸터 및 공통 레이아웃. notifications.css: 이 페이지 전용 스타일. -->
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../Header_Footer.css">
  <link rel="stylesheet" href="notifications.css">
</head>
<body>
  <!-- common.js가 fetch로 header.html을 읽어와 이 자리에 채워 넣는다(헤더/알림벨/프로필 포함). -->
  <div id="header-placeholder"></div>

  <div class="notif-page">
    <h1 class="notif-page-title">알림</h1>

    <div class="notif-toolbar">
      <!-- 카테고리 탭: 알림 type을 common.js의 NOTIFICATION_GROUPS 매핑으로 분류해 걸러낸다.
           data-tab 값이 notifications.js의 notifCurrentTab / filterByTab()에서 그대로 쓰인다. -->
      <div class="notif-tabs">
        <button type="button" class="notif-tab active" data-tab="all">전체</button>
        <button type="button" class="notif-tab" data-tab="notice">공지</button>
        <button type="button" class="notif-tab" data-tab="mention">멘션</button>
        <button type="button" class="notif-tab" data-tab="event">이벤트</button>
      </div>

      <!-- 정렬/읽음 필터: 탭으로 걸러진 목록에 추가로 적용된다(정렬 순서 또는 읽음 여부 필터).
           value가 notifications.js의 applySortFilter()의 case 분기와 1:1로 대응한다. -->
      <select id="notif-sort-select" class="notif-sort-select">
        <option value="all">전체</option>
        <option value="latest">최신순</option>
        <option value="oldest">날짜별 (오래된 것)</option>
        <option value="read">읽은 것</option>
        <option value="unread">안 읽은 것</option>
      </select>
    </div>

    <!-- 알림 목록이 그려지는 자리. notifications.js의 renderNotifList()가 매번 innerHTML을
         통째로 다시 그린다(탭 전환/정렬 변경/클릭 후 읽음 갱신 시마다 재호출). -->
    <div id="notif-list" class="notif-list"></div>
  </div>

  <!-- common.js가 footer.html을 채워 넣는 자리. -->
  <div id="footer-placeholder"></div>
  <script src="../theme.js"></script>
  <script src="../common.js"></script>
  <script src="notifications.js"></script>
</body>
</html>
