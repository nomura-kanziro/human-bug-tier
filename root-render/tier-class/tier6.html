<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 6등급(중하위권 무투파 or 정예 사제 / 골드) 공식 티어표 페이지.
       tier1~9.html은 head 링크/스크립트 구성과 body 골격(header/footer
       placeholder, section.tier-table > tier-row > tier-cards > char)이 모두
       동일하고 등급별 캐릭터 목록·색상 테마(tierN.css)만 다르다. 상세 설명은
       tier1.html 주석 참고. common.js가 header/footer를 삽입·경로 보정하고,
       tier-nav.js가 이전/다음 등급 네비 + 제목(h2) 윤광을 붙인다. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6등급 - 중하위권 무투파 or 정예 사제 / 골드 | 휴버대 티어표</title>
  <link rel="stylesheet" href="tier6.css">
  <link rel="stylesheet" href="tier-responsive.css">
  <link rel="stylesheet" href="tier-nav.css">
  <link rel="stylesheet" href="../Header_Footer.css">
  <script src="../common.js"></script>
  <script defer src="tier-nav.js"></script>
</head>
<body>
  <!-- 상단 네비게이션 -->
  <div id="header-placeholder"></div>

  <main>
    <!-- tier-nav.js가 로드 후 이 h2에 tier-heading 클래스 + data-tier="6"를 붙여
         등급 테마색 윤광 애니메이션(tier-nav.css)을 적용한다 -->
    <h2>6등급 - 중하위권 무투파 or 정예 사제 / 골드</h2>
    <!-- 등급표 본체. tier-row(세부등급 한 줄)가 갑급→병급 순으로 쌓인 구조
         (다른 등급과 달리 6등급은 정급 행이 없다) -->
    <section class="tier-table">
      <!-- 세부등급 한 줄 = tier-label(등급 이름) + tier-cards(캐릭터 카드 목록).
           char 카드는 img(썸네일)+span(이름) 조합이며, custom-maker.js의
           loadCharactersFromTierClass()가 이 tier6.html을 fetch·파싱해서
           커스텀 티어 메이커의 캐릭터 풀도 자동으로 채운다(자세한 설명은
           tier1.html 참고). -->
      <div class="tier-row">
        <div class="tier-label">갑급</div>
        <div class="tier-cards">
          <div class="char">
            <img src="../tier-media/6 tier/rokawa takao.webp" alt="">
            <span>루카와 타카오</span>
          </div>
          <div class="char">
            <img src="../tier-media/6 tier/moriwaka.webp" alt="">
            <span>모리카와</span>
          </div>
          <div class="char">

          </div>
          <div class="char">

            <span>히나가타 지에이</span>
          </div>
          <div class="char">

            <span>누마타</span>
          </div>
          <div class="char">

            <span>*카네마루</span>
          </div>
          <div class="char">

            <span>*하시바 카즈나리</span>
          </div>
          <div class="char">
            <img src="../tier-media/6 tier/kisaragi.webp" alt="">
            <span>*키사라기</span>
          </div>
          <div class="char">
            <img src="../tier-media/6 tier/ozaki takao.webp" alt="">

          <div class="char">

      </div>

      <!-- 을급 행 — 구조 동일 -->

  </main>
