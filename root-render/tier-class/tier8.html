<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 8등급(평범한 사제 수준의 전투력 / 브론즈) 공식 티어표 페이지.
       tier1~9.html은 head 링크/스크립트 구성과 body 골격(header/footer
       placeholder, section.tier-table > tier-row > tier-cards > char)이 모두
       동일하고 등급별 캐릭터 목록·색상 테마(tierN.css)만 다르다. 상세 설명은
       tier1.html 주석 참고. common.js가 header/footer를 삽입·경로 보정하고,
       tier-nav.js가 이전/다음 등급 네비 + 제목(h2) 윤광을 붙인다. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8등급 - 평범한 사제 수준의 전투력 / 브론즈 | 휴버대 티어표</title>
  <link rel="stylesheet" href="tier8.css">
  <link rel="stylesheet" href="tier-responsive.css">
  <link rel="stylesheet" href="tier-nav.css">
  <link rel="stylesheet" href="../Header_Footer.css">
  <script src="../common.js"></script>
  <script defer src="tier-nav.js"></script>
</head>
<body>
  <!-- 상단 네비게이션 -->
  <div id="header-placeholder"></div>

  <main>
    <!-- tier-nav.js가 로드 후 이 h2에 tier-heading 클래스 + data-tier="8"를 붙여
         등급 테마색 윤광 애니메이션(tier-nav.css)을 적용한다 -->
    <h2>8등급 - 평범한 사제 수준의 전투력 / 브론즈</h2>
    <!-- 등급표 본체. tier-row(세부등급 한 줄)가 갑급→병급 순으로 쌓인 구조
         (다른 등급과 달리 8등급은 정급 행이 없다) -->
    <section class="tier-table">
      <!-- 세부등급 한 줄 = tier-label(등급 이름) + tier-cards(캐릭터 카드 목록).
           char 카드는 img(썸네일)+span(이름) 조합이며, custom-maker.js의
           loadCharactersFromTierClass()가 이 tier8.html을 fetch·파싱해서
           커스텀 티어 메이커의 캐릭터 풀도 자동으로 채운다(자세한 설명은
           tier1.html 참고). -->
      <div class="tier-row">
        <div class="tier-label">갑급</div>
        <div class="tier-cards">
          <div class="char">
            <img src="../tier-media/8 tier/ieiri.webp" alt="">
            <span>이에이리</span>
          </div>
          <div class="char">
            <img src="../tier-media/8 tier/miyamoto.webp" alt="">
            <span>미야모토</span>
          </div>
          <div class="char">
            <img src="../tier-media/8 tier/yamai mitsuru.webp" alt="">
            <span>야마이 미츠루</span>
          </div>
          <div class="char">
            <img src="../tier-media/8 tier/murai.webp" alt="">
            <span>무라이</span>
          </div>
          <div class="char">
            <img src="../tier-media/8 tier/furuya.webp" alt="">
            <span>후루야</span>
          </div>
        </div>
      </div>

      <!-- 을급 행 — 구조 동일 -->
      <div class="tier-row">
        <div class="tier-label">을급</div>
        <div class="tier-cards">
          <div class="char">
            <img src="../tier-media/8 tier/saito hiroshi.webp" alt="">
            <span>사이토 히로시</span>
          </div>
          <div class="char">
            <img src="../tier-media/8 tier/kitamura.webp" alt="">
            <span>키타무라</span>
          </div>
          <div class="char">
            <img src="../tier-media/8 tier/akasaka shotaro.webp" alt="">
            <span>아카사카 쇼타로</span>
          </div>
          <div class="char">
            <img src="../tier-media/8 tier/yamamiso.jpg" alt="">
            <span>야마미소</span>
          </div>
          <div class="char">
            <img src="../tier-media/8 tier/isomirim.jpg" alt="">
            <span>이소미림</span>
          </div>
          <div class="char">
            <img src="../tier-media/8 tier/nue kyoichi.webp" alt="">
            <span>누에 쿄이치</span>
          </div>
        </div>
      </div>

      <!-- 병급 행 — 구조 동일. 이 페이지의 마지막 세부등급 -->
      <div class="tier-row">
        <div class="tier-label">병급</div>
        <div class="tier-cards">
          <div class="char">
            <img src="../tier-media/8 tier/mogi koshiro.webp" alt="">
            <span>모기 코시로</span>
          </div>
          <div class="char">
            <img src="../tier-media/8 tier/tsurumaki.webp" alt="">
            <span>츠루마키</span>
          </div>
          <div class="char">
            <img src="../tier-media/8 tier/kida kei.webp" alt="">
            <span>키다 케이</span>
          </div>
          <div class="char">
            <img src="../tier-media/8 tier/dinosaur kids izumi.webp" alt="">
            <span>공룡키즈 이즈미</span>
          </div>
          <div class="char">
            <img src="../tier-media/8 tier/saijo hidero.webp" alt="">
            <span>사이죠 히데로</span>
          </div>
          <div class="char">
            <img src="../tier-media/8 tier/fuji.webp" alt="">
            <span>후지</span>
          </div>
        </div>
      </div>

    </section>
  </main>

  <!-- 하단 -->
  <div id="footer-placeholder"></div>
</body>
</html>
