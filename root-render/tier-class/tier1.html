<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 라이트/다크 테마 FOUC(첫 렌더링 깜빡임) 방지: CSS가 로드되기 전에 즉시
       <html data-theme="light|dark">를 정해둔다. 저장된 값이 없으면(한 번도 토글을
       안 눌렀으면) 현재 시각 기준 자동값(오전 7시~밤 10시 전=라이트, 그 외=다크)을 쓴다.
       상세 로직/토글 클릭 처리는 theme.js 참고. -->
  <script>(function(){try{var t=localStorage.getItem('hbtTheme');if(t!=='light'&&t!=='dark'){var h=new Date().getHours();t=(h>=7&&h<22)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="../theme.css">
  <!-- ======================================================================
       1등급(신계 / 슈퍼 그랜드 마스터) 공식 티어표 페이지
       tier1~9.html은 전부 같은 골격(head 링크/스크립트 구성, header/footer
       placeholder, section.tier-table > tier-row > tier-cards > char)을
       공유하고, 등급별로 캐릭터 목록과 색상 테마(tierN.css)만 다르다.
       - tier1.css: 이 등급 전용 스타일. 1등급만 유일하게 보석처럼 반짝이는
         배경 애니메이션이 들어가 있음(다른 등급 css는 단색 배경)
       - tier-responsive.css: 1~9등급 페이지가 공유하는 모바일(≤768px) 레이아웃 보정
       - tier-nav.css: 이전/다음 등급 이동 버튼 + 등급 제목(h2) 윤광 효과 스타일
       - ../Header_Footer.css: 사이트 공통 헤더/푸터 자체 스타일
       - ../common.js: header.html/footer.html을 #header-placeholder,
         #footer-placeholder에 fetch로 읽어와 삽입하고, getBasePath()로 링크의
         상대경로를 현재 배포 위치(로컬/Render)에 맞게 보정해준다
       - tier-nav.js: 파일명(tier1.html)에서 현재 등급 번호를 읽어 main 맨 위에
         "← 이전 등급 / 다음 등급 →" 네비를 자동 생성하고, h2에 tier-heading
         클래스 + data-tier="1" 속성을 붙여 tier-nav.css의 등급별 윤광 색을 입힌다
       ====================================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1등급 - 신계 / 슈퍼 그랜드 마스터 | 휴버대 티어표</title>
  <link rel="stylesheet" href="tier1.css">
  <link rel="stylesheet" href="tier-responsive.css">
  <link rel="stylesheet" href="tier-nav.css">
  <link rel="stylesheet" href="../Header_Footer.css">
  <script src="../theme.js"></script>
  <script defer src="../common.js"></script>
  <script defer src="tier-nav.js"></script>
</head>
<body>
  <!-- common.js가 fetch로 header.html을 불러와 이 자리에 삽입한다(로그인 여부에 따라 메뉴 구성이 달라짐) -->
  <div id="header-placeholder"></div>

  <main>
    <!-- 등급 제목. tier-nav.js가 로드 후 여기에 tier-heading 클래스 + data-tier 속성을
         붙여 tier-nav.css의 윤광(glow) 애니메이션 색을 이 등급 테마색으로 지정한다 -->
    <h2>1등급 - 신계 / 슈퍼 그랜드 마스터</h2>
    <!-- 등급표 본체. tier-row(하위 세부등급 한 줄)가 여러 개 세로로 쌓인 구조 -->
    <section class="tier-table">
      <!-- 하위 세부등급 한 줄 = tier-label(등급 이름) + tier-cards(캐릭터 카드 목록).
           char 하나가 캐릭터 카드 한 장으로, img(썸네일) + span(이름) 조합이며
           span이 없으면 커스텀 메이커가 img의 alt 속성을 이름으로 대신 쓴다(아래 참고).
           같은 캐릭터를 여러 장의 다른 이미지로 보여줄 때는 이름이 있는 카드 하나만
           span을 넣고 나머지는 img만 두는 식으로 표기한다(예: 우류 타츠오미 3장).
           이 .char 마크업은 custom-maker.js의 loadCharactersFromTierClass()가
           tier1~9.html을 fetch → DOM 파싱해서 커스텀 티어 메이커의 캐릭터 풀을
           자동으로 채우는 데도 그대로 재사용되므로(img/span 구조를 그대로 읽음),
           카드 구조를 바꾸면 커스텀 메이커 쪽 파싱도 함께 깨질 수 있다. -->
      <div class="tier-row">
        <div class="tier-label">갑급</div>
        <div class="tier-cards">
          <div class="char">
            <img src="../tier-media/1 tier/uryu3paze.webp" alt="우류 타츠오미">
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/uryu2paze.jpg" alt="우류 타츠오미">
            <span>우류 타츠오미</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/uryu1paze.jpg" alt="우류 타츠오미">
          </div>
        </div>
      </div>

      <!-- 을급 행 — 위 갑급 행과 구조 동일 -->
      <div class="tier-row">
        <div class="tier-label">을급</div>
        <div class="tier-cards">
          <div class="char">
            <img src="../tier-media/1 tier/tsurugi.jpg" alt="츠루기 시노부">
            <span>츠루기 시노부</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/nomura.jpg" alt="노무라 칸지로">
            <span>*노무라 칸지로</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/sakaki choske.jpg" alt="사카키 쵸스케">
            <span>사카키 쵸스케</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/toma tatsunosin.jpg" alt="토마 타츠노신">
            <span>토마 타츠노신</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/orion.jpg" alt="오리온">
            <span>오리온</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/toshiya.jpg" alt="누에 토시야">
            <span>누에 토시야</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/heiji.jpg" alt="헤이지">
            <span>*헤이지</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/suo ritsu.jpg" alt="스오 리츠">
            <span>스오 리츠</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/shiden.jpg" alt="시덴">
            <span>시덴</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/yamamoto gosho.jpg" alt="야마모토 고쇼">
            <span>*야마모토 고쇼</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/mist.jpg" alt="미스트">
            <span>미스트</span>
          </div>
        </div>
      </div>

      <!-- 병급 행 — 구조 동일 -->
      <div class="tier-row">
        <div class="tier-label">병급</div>
        <div class="tier-cards">
          <div class="char">
            <img src="../tier-media/1 tier/nue tomoya.jpg" alt="누에 토모야">
            <span>누에 토모야</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/gen unran.jpg" alt="겐 운란">
            <span>겐 운란</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/sera renjiro.jpg" alt="세라 렌지로">
            <span>세라 렌지로</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/bath.jpg" alt="바스">
            <span>바스</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/iba kanto.jpg" alt="이바 칸토">
            <span>*이바 칸토</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/akaki eikichi.png" alt="아카기 에이키치">
            <span>*아카기 에이키치</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/sakurai.jpg" alt="사쿠라이">
            <span>*사쿠라이</span>
          </div>
        </div>
      </div>

      <!-- 정급 행 — 구조 동일 -->
      <div class="tier-row">
        <div class="tier-label">정급</div>
        <div class="tier-cards">
          <div class="char">
            <img src="../tier-media/1 tier/raiden.jpg" alt="라이덴">
            <span>라이덴</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/seruzio.jpg" alt="세르지오">
            <span>*세르지오</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/jake.jpg" alt="제이크">
            <span>제이크</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/inhao brother 2.jpg" alt="인하오">
            <span>인하오</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/inhao brother 1.jpg" alt="형제">
            <span>형제</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/seikiji.jpg" alt="세이키치">
            <span>세이키치</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/aoyagi kouga.jpg" alt="아오야기 코우가">
            <span>아오야기 코우가</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/machida tomoyasu.jpg" alt="마치다 토모야스">
            <span>마치다 토모야스</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/sai.jpg" alt="사이">
            <span>*사이</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/shamo.jpg" alt="샤모">
            <span>샤모</span>
          </div>
          <div class="char">
            <img src="../tier-media/1 tier/suiran.jpg" alt="스이란">
            <span>스이란</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- common.js가 fetch로 footer.html을 불러와 이 자리에 삽입한다 -->
  <div id="footer-placeholder"></div>
</body>
</html>
