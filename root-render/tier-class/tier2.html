<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 라이트/다크 테마 FOUC(첫 렌더링 깜빡임) 방지: CSS가 로드되기 전에 즉시
       <html data-theme="light|dark">를 정해둔다. 저장된 값이 없으면(한 번도 토글을
       안 눌렀으면) 현재 시각 기준 자동값(오전 7시~밤 10시 전=라이트, 그 외=다크)을 쓴다.
       상세 로직/토글 클릭 처리는 theme.js 참고. -->
  <script>(function(){try{var t=localStorage.getItem('hbtTheme');if(t!=='light'&&t!=='dark'){var h=new Date().getHours();t=(h>=7&&h<22)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="../theme.css">
  <!-- 2등급(뒷세계의 전설 / 그랜드 마스터) 공식 티어표 페이지.
       tier1~9.html은 head 링크/스크립트 구성과 body 골격(header/footer
       placeholder, section.tier-table > tier-row > tier-cards > char)이 모두
       동일하고 등급별 캐릭터 목록·색상 테마(tierN.css)만 다르다. 상세 설명은
       tier1.html 주석 참고. common.js가 header/footer를 삽입·경로 보정하고,
       tier-nav.js가 이전/다음 등급 네비 + 제목(h2) 윤광을 붙인다. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2등급 - 뒷세계의 전설 / 그랜드 마스터 | 휴버대 티어표</title>
  <link rel="stylesheet" href="tier2.css">
  <link rel="stylesheet" href="tier-responsive.css">
  <link rel="stylesheet" href="tier-nav.css">
  <link rel="stylesheet" href="../Header_Footer.css">
  <script src="../theme.js"></script>
  <script defer src="../common.js"></script>
  <script defer src="tier-nav.js"></script>
</head>
<body>
  <!-- 상단 네비게이션 -->
  <div id="header-placeholder"></div>

  <main>
    <!-- tier-nav.js가 로드 후 이 h2에 tier-heading 클래스 + data-tier="2"를 붙여
         등급 테마색 윤광 애니메이션(tier-nav.css)을 적용한다 -->
    <h2>2등급 - 뒷세계의 전설 / 그랜드 마스터</h2>
    <!-- 등급표 본체. tier-row(세부등급 한 줄)가 갑급→정급 순으로 쌓인 구조 -->
    <section class="tier-table">
      <!-- 세부등급 한 줄 = tier-label(등급 이름) + tier-cards(캐릭터 카드 목록).
           char 카드는 img(썸네일)+span(이름) 조합이며, custom-maker.js의
           loadCharactersFromTierClass()가 이 tier2.html을 fetch·파싱해서
           커스텀 티어 메이커의 캐릭터 풀도 자동으로 채운다(자세한 설명은
           tier1.html 참고). -->
      <div class="tier-row">
        <div class="tier-label">갑급</div>
        <div class="tier-cards">
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/mikato irochita.jpg" alt="미카도 이로치타">
            <span>*미카도 이로치타</span>
          </div>
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/hakamada hidero.jpg" alt="하카마다 히데코">
            <span>하카마다 히데코</span>
          </div>
          <div class="char"><img src="../tier-media/tier-image/2 tier/moriwaka.jpg" alt="모리와카 토시로">
            <span>모리와카 토시로</span>
          </div>
          <div class="char"><img src="../tier-media/tier-image/2 tier/ichijyo komei.jpg" alt="이치죠 코메이">
            <span>이치죠 코메이</span>
          </div>
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/kosaka shintaro.jpg" alt="코사카 신타로">
            <span>코사카_신타로</span>
          </div>
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/davits.jpg" alt="다비츠">
            <span>다비츠</span>
          </div>
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/hozaki kikpei.jpg" alt="호자키 킷페이">
            <span>호자키 킷페이</span>
          </div>
        </div>
      </div>

      <!-- 을급 행 — 구조 동일 -->
      <div class="tier-row">
        <div class="tier-label">을급</div>
        <div class="tier-cards">
          <div class="char">            
            <img src="../tier-media/tier-image/2 tier/hyakuda goro.png" alt="햐쿠타 고로">
            <span>햐쿠타 고로</span>
          </div>
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/togari genya.jpg" alt="토가리 겐야">
            <span>토가리 겐야</span>
          </div>
          <div  class="char">
            <img src="../tier-media/tier-image/2 tier/kobayashi.jpg" alt="코바야시 유키사다">
            <span>코바야시 유키사다</span>
          </div>
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/sorimachi koziro.jpg" alt="소리마치 코지로">
            <span>소리마치 코지로</span>
          </div>
        </div>
      </div>
      
      <!-- 병급 행 — 구조 동일 -->
      <div class="tier-row">
        <div class="tier-label">병급</div>
        <div class="tier-cards">              
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/ichigo rintaro.png" alt="이치고 린타로">
            <span>*이치고 린타로</span>
          </div>
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/sanada ryosuke.jpg" alt="사나다 료스케">
            <span>*사나다 료스케</span>
          </div>
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/izyuin shigeo.jpg" alt="이쥬인 시게오">
            <span>이쥬인 시게오</span>
          </div>
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/igunashio.jpg" alt="이그나시오">
            <span>*이그나시오</span>
          </div>
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/agatsuma kyoya.jpg" alt="아가츠마 쿄야">
            <span>아가츠마 쿄야</span>
          </div>
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/kinpo satoru.jpg" alt="킨포 사토루">
            <span>킨포 사토루</span>
          </div>
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/pink.jpg" alt="핑크">
            <span>핑크</span>
          </div>
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/yakushimaru.jpg" alt="야쿠시마루 야키라">
            <span>야쿠시마루 야키라</span>
          </div>
          <div class="char">

      </div>

      <!-- 정급 행 — 구조 동일 -->
      <div class="tier-row">
        <div class="tier-label">정급</div>
        <div class="tier-cards">
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/zyogasaki kenshi.jpg" alt="죠가사키 켄시">
            <span>죠가사키 켄시</span>
          </div>
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/mori kohei.jpg" alt="모리 코헤이">
            <span>모리 코헤이</span>
          </div>
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/kunitachi masakuni.jpg" alt="쿠니타치 마사쿠니">
            <span>쿠니타치 마사쿠니</span>
          </div>
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/kita kintaro.jpg" alt="키타 킨타로">
            <span>키타 킨타로</span>
          </div>
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/akagawa arimoto.jpg" alt="아키가와 아리모토">

          </div>
          <div class="char">

            <span>에이지</span>
          </div>
          <div class="char">

            <span>츄러스</span>

          <div class="char">
            <img src="../tier-media/tier-image/2 tier/kani.jpg" alt="카니">
            <span>카니</span>
          </div>
          <div class="char">
            <img src="../tier-media/tier-image/2 tier/matsuo kuranosuke.jpg" alt="*마츠오 쿠라노스케">
            <span>*마츠오 쿠라노스케</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 하단 -->
  <div id="footer-placeholder"></div>
</body>
</html>
