<!--
  sign_up.html - 회원가입 페이지
  ============================================
  login.html과 같은 레이아웃(login-box + side-panel)을 재사용하되 입력칸만 다르다.
  실제 회원가입 요청(계정 생성 + 인증 메일 발송)은 sign_up.js가 담당하고,
  이 파일은 마크업과 onclick 연결만 담당한다.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 라이트/다크 테마 FOUC(첫 렌더링 깜빡임) 방지: CSS가 로드되기 전에 즉시
       <html data-theme="light|dark">를 정해둔다. 저장된 값이 없으면(한 번도 토글을
       안 눌렀으면) 현재 시각 기준 자동값(오전 7시~밤 10시 전=라이트, 그 외=다크)을 쓴다.
       상세 로직/토글 클릭 처리는 theme.js 참고. -->
  <script>(function(){try{var t=localStorage.getItem('hbtTheme');if(t!=='light'&&t!=='dark'){var h=new Date().getHours();t=(h>=7&&h<22)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="../theme.css">
  <meta charset="UTF-8" />
  <title>회원가입</title>
  <link rel="stylesheet" href="sign_up.css" />   <!-- 같은 디자인 재사용 -->
</head>
<body>


  <!-- 공용 헤더(header.html)가 없는 단독 페이지라 우상단에 별도로 테마 토글을 띄운다.
       모양·동작은 header.html의 것과 완전히 동일(theme.css/theme.js 공용), 위치만 고정. -->
  <button type="button" class="theme-toggle-btn theme-toggle-floating" data-theme-toggle
          role="switch" aria-checked="false" aria-label="다크 모드 전환" title="화면 밝기 전환">
    <span class="theme-toggle-icon theme-toggle-icon-sun" aria-hidden="true">☀️</span>
    <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
    <span class="theme-toggle-icon theme-toggle-icon-moon" aria-hidden="true">🌙</span>
  </button>
  <!-- 좌상단 로고: 클릭 시 홈(메인 티어표)으로 이동 (sign_up.js: goHome) -->
  <div class="logo" onclick="goHome()">
      <img src="../tier-media/logo.webp" alt="로고" class="logo-img">
      휴버대 티어표
  </div>

  <div class="login-wrapper">
    <div class="login-box">
      <h2 style="color:#000;">회원가입</h2>

      <!-- 아이디는 회원가입 시 그대로 서버의 nickname으로 저장된다(sign_up.js 참고) -->
      <input type="text" id="userId" placeholder="아이디" />
      <input type="password" id="userPw" placeholder="비밀번호" />
      <input type="password" id="userPwConfirm" placeholder="비밀번호 확인" />
      <input type="email" id="userEmail" placeholder="이메일 (선택)" />

      <button onclick="signUp()" style="width:240px; margin-top:10px;">회원가입</button>

      <!-- 이미 계정이 있으신가요? -->
      <div class="find-btn" onclick="goToLogin()" style="margin-top:15px; text-decoration:none; color:#555;">
        이미 계정이 있으신가요? 로그인하기
      </div>

      <!-- 돌아가기 (브라우저 히스토리상 이전 페이지로) -->
      <div class="back-btn" onclick="goBack()">⟳</div>
    </div>

    <!-- 오른쪽 컬러 영역 (기능 없음, 순수 장식) -->
    <div class="side-panel"></div>
  </div>

  <!-- auth_api.js: getAuthApiBase() 정의 (sign_up.js가 사용) -->
  <script src="auth_api.js"></script>
  <script src="sign_up.js"></script>
  <!-- PWA 설치/서비스워커 등록 (사이트 전체 공통) -->
  <script src="../theme.js"></script>
  <script src="../pwa-register.js"></script>
</body>
</html>
