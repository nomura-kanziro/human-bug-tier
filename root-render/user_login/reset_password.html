<!--
  reset_password.html - 비밀번호 재설정 페이지 (이메일 링크로만 접근)
  ============================================
  find_account.html에서 "비밀번호 재설정 링크 받기"를 누르면 서버가 이 페이지 주소에
  1회용 토큰을 붙인 링크(reset_password.html?token=...)를 이메일로 보낸다.
  find_account.css를 그대로 재사용해 로그인류 페이지와 톤을 맞춘다.
  전용 CSS 파일은 없고, 실제 동작(토큰 검증 → 새 비밀번호 저장)은 reset_password.js가 담당한다.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>비밀번호 재설정</title>
  <link rel="stylesheet" href="find_account.css" />
</head>
<body>
  <!-- 좌상단 로고: 클릭 시 홈(메인 티어표)으로 이동 -->
  <div class="logo" onclick="location.href='../index.html'">
    <img src="../tier-media/logo.webp" alt="로고" class="logo-img">
    휴버대 티어표
  </div>

  <div class="login-wrapper">
    <div class="login-box">
      <h2 style="color:#000;">비밀번호 재설정</h2>
      <!-- 토큰 검증 결과/제출 결과 안내 문구. reset_password.js의 showStatus()가 내용·색상·표시 여부를 제어 -->
      <p id="reset-status" style="display:none; margin:0 0 12px; font-size:14px; line-height:1.5;"></p>
      <!-- 토큰이 유효할 때만 활성화된다(reset_password.js: setFormEnabled) -->
      <input type="password" id="newPassword" placeholder="새 비밀번호" />
      <input type="password" id="confirmPassword" placeholder="새 비밀번호 확인" />
      <button id="reset-btn" type="button" style="width:240px; margin-top:15px;">비밀번호 변경</button>
      <p style="margin-top:16px;"><a href="login.html">로그인으로 돌아가기</a></p>
    </div>
  </div>

  <!-- auth_api.js: getAuthApiBase() 정의 (reset_password.js가 사용) -->
  <script src="auth_api.js"></script>
  <script src="reset_password.js"></script>
  <!-- PWA 설치/서비스워커 등록 (사이트 전체 공통) -->
  <script src="../pwa-register.js"></script>
</body>
</html>
