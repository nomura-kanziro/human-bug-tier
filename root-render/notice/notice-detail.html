<!--
  notice-detail.html - 공지 상세 페이지 (전체 공지 / 새 소식 공통으로 사용)
  목록(notice.html, all_notices.html, news.html, 홈 미리보기)에서 공지 카드를 클릭하면
  ?id=<mongoId> 쿼리스트링과 함께 이 페이지로 이동한다. 정적 뼈대는 로딩 문구 하나뿐이고,
  실제 제목/본문/작성자/뱃지 등 전체 카드 HTML은 notice.js의 renderNoticeDetailPage()가
  id="notice-detail-container" 안을 통째로 교체해서 채운다.
  body에 data-page="notice-detail" 속성을 둔 것은 notice.js의 isNoticeDetailPage()가
  이 페이지를 확실히 인식하기 위한 신호 중 하나(URL 패턴이 애매한 배포 환경 대비).
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 라이트/다크 테마 FOUC(첫 렌더링 깜빡임) 방지: CSS가 로드되기 전에 즉시
       <html data-theme="light|dark">를 정해둔다. 저장된 값이 없으면(한 번도 토글을
       안 눌렀으면) 현재 시각 기준 자동값(오전 7시~밤 10시 전=라이트, 그 외=다크)을 쓴다.
       상세 로직/토글 클릭 처리는 theme.js 참고. -->
  <script>(function(){try{var t=localStorage.getItem('hbtTheme');if(t!=='light'&&t!=='dark'){var h=new Date().getHours();t=(h>=7&&h<22)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../loading-screen.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지 상세 - 휴버대 티어표</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="notice.css">
  <link rel="stylesheet" href="../Header_Footer.css">
</head>
<body data-page="notice-detail">
  <!-- 사이트 전체 초기 로딩 화면: 모든 리소스가 준비될 때까지 화면을 덮는 오버레이.
       모양은 loading-screen.css, 표시/숨김 타이밍은 loading-screen.js가 담당한다. -->
  <div class="site-loading-screen" id="site-loading-screen" role="status" aria-live="polite" aria-label="불러오는 중">
    <div class="site-loading-inner">
      <svg class="site-loading-svg" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="site-loading-track" cx="50" cy="50" r="37"></circle>
        <circle class="site-loading-track" cx="50" cy="50" r="30"></circle>
        <circle pathLength="360" class="site-loading-dash big" style="--sped:3.6s" cx="50" cy="50" r="37"></circle>
        <circle pathLength="360" class="site-loading-dash" style="--sped:2s" cx="50" cy="50" r="30"></circle>
      </svg>
      <img src="../tier-media/tier-image/logo.webp" alt="" class="site-loading-logo">
    </div>
    <p class="site-loading-text">불러오는 중…</p>
  </div>
  <div id="header-placeholder"></div>

  <div class="notice-page notice-detail-page">
    <!-- 초기에는 로딩 문구만 있고, notice.js가 fetchNoticeById() 응답을 받으면
         이 컨테이너 내부 전체를 상세 카드 HTML로 교체한다 -->
    <div id="notice-detail-container">
      <div class="notice-detail-loading">공지를 불러오는 중...</div>
    </div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="../theme.js"></script>
  <script src="../loading-screen.js"></script>
  <script src="../common.js"></script>
  <script src="notice.js"></script>
  <!-- notice.js 자체의 DOMContentLoaded 리스너도 detectPageType()으로 이 페이지를 인식해
       initNoticeDetailPage()를 호출하지만, 로드 순서/타이밍 이슈에 대비해 이 페이지에서
       한 번 더 명시적으로 호출한다. initNoticeDetailPage() 내부의 noticeDetailInitialized
       가드 플래그가 중복 호출로 인한 이중 렌더링을 막아준다. -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof window.initNoticeDetailPage === 'function') {
        window.initNoticeDetailPage();
      }
    });
  </script>
</body>
</html>
