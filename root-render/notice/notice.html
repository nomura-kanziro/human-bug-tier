<!--
  notice.html - 공지사항 메인 페이지
  '전체 공지'(초록) / '새 소식'(보라) 두 카테고리를 좌우 2컬럼으로 보여주는 허브 페이지.
  각 컬럼의 실제 목록 항목(최신 5개 미리보기)은 notice.js의 renderNoticeMainPage()가
  아래 id="notice-list-general" / "notice-list-news" 자리에 채워 넣는다(정적 HTML은 뼈대만 제공).
  "문서 모두 보기 →" 링크를 누르면 각각 all_notices.html / news.html 전체목록 페이지로 이동.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 라이트/다크 테마 FOUC(첫 렌더링 깜빡임) 방지: CSS가 로드되기 전에 즉시
       <html data-theme="light|dark">를 정해둔다. 저장된 값이 없으면(한 번도 토글을
       안 눌렀으면) 현재 시각 기준 자동값(오전 7시~밤 10시 전=라이트, 그 외=다크)을 쓴다.
       상세 로직/토글 클릭 처리는 theme.js 참고. -->
  <script>(function(){try{var t=localStorage.getItem('hbtTheme');if(t!=='light'&&t!=='dark'){var h=new Date().getHours();t=(h>=7&&h<22)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="../theme.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 - 휴버대 티어표</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="notice.css">
  <link rel="stylesheet" href="../Header_Footer.css">
</head>
<body>
  <!-- common.js가 로드 시 header.html/footer.html을 이 자리에 fetch해서 채워 넣는다 -->
  <div id="header-placeholder"></div>

  <div class="notice-page">
    <h1 class="notice-title">공지사항</h1>

    <div class="notice-grid">
      <!-- 왼쪽 컬럼: 전체 공지(운영 공지 등 모든 사용자 대상 안내) -->
      <div class="notice-col notice-col-general">
        <h2 class="notice-col-title">
          <span class="notice-dot" style="background:#10b981;"></span>
          전체 공지
        </h2>
        <!-- notice.js renderNoticeMainPage()가 fetchNotices('notice', 5) 결과로 채움 -->
        <div id="notice-list-general" class="notice-list"></div>
        <!-- 링크 텍스트("문서 N개 모두 보기")는 JS가 전체 개수를 다시 조회해 채워 넣는다 -->
        <a href="all_notices.html" id="notice-count-general" class="notice-more">문서 모두 보기 →</a>
      </div>

      <!-- 오른쪽 컬럼: 새 소식(업데이트/이벤트 등 뉴스성 안내, 유튜브 번역 글 포함 가능) -->
      <div class="notice-col notice-col-news">
        <h2 class="notice-col-title">
          <span class="notice-dot" style="background:#8b5cf6;"></span>
          새 소식
        </h2>
        <div id="notice-list-news" class="notice-list"></div>
        <a href="news.html" id="notice-count-news" class="notice-more">문서 모두 보기 →</a>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="../theme.js"></script>
  <script src="../common.js"></script>
  <!-- notice.js는 DOMContentLoaded 시 detectPageType()으로 이 페이지를 'notice_main'으로 인식하고
       renderNoticeMainPage()를 자동 실행한다(별도 초기화 코드가 이 파일 안에 필요 없음) -->
  <script src="notice.js"></script>
</body>
</html>
