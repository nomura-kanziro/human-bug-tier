<!--
  all_notices.html - '전체 공지' 카테고리 전용 전체 목록 페이지
  notice.html 메인 화면에서는 최신 5개만 미리보기로 보여주는데, 여기서는 해당 카테고리의
  공지를 전부(개수 제한 없이) 나열한다. 실제 목록은 notice.js의 renderNoticeFullPage('notice')가
  id="notice-full-list" 자리에 채워 넣는다.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 라이트/다크 테마 FOUC(첫 렌더링 깜빡임) 방지: CSS가 로드되기 전에 즉시
       <html data-theme="light|dark">를 정해둔다. 저장된 값이 없으면(한 번도 토글을
       안 눌렀으면) 현재 시각 기준 자동값(오전 7시~밤 10시 전=라이트, 그 외=다크)을 쓴다.
       상세 로직/토글 클릭 처리는 theme.js 참고. -->
  <script>(function(){try{var t=localStorage.getItem('hbtTheme');if(t!=='light'&&t!=='dark'){var h=new Date().getHours();t=(h>=7&&h<22)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="../theme.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전체 공지 - 휴버대 티어표</title>
  <link rel="stylesheet" href="notice.css">
  <link rel="stylesheet" href="../Header_Footer.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="notice-page">
    <div class="notice-header">
      <h1 class="notice-title">
        <span class="notice-dot" style="background:#10b981;"></span>
        전체 공지
      </h1>
      <a href="notice.html" class="back-link">← 공지사항 메인으로</a>
    </div>

    <!-- notice.js renderNoticeFullPage('notice')가 fetchNotices('notice')(개수 제한 없음) 결과로 채움 -->
    <div id="notice-full-list" class="notice-full-list"></div>
    <!-- 실제 페이지 넘김 없이 "총 N개"만 표시(전체를 한 번에 로드하는 구조라 페이지네이션 API가 없음) -->
    <div id="notice-pagination" class="pagination"></div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="../theme.js"></script>
  <script src="../common.js"></script>
  <!-- notice.js가 URL 경로에 'all_notices'가 포함된 것을 보고(detectPageType) 자동으로
       renderNoticeFullPage('notice')를 실행한다 -->
  <script src="notice.js"></script>
</body>
</html>
