<!--
  news.html - '새 소식' 카테고리 전용 전체 목록 페이지
  구조는 all_notices.html과 완전히 동일하고(같은 notice.css 클래스, 같은 renderNoticeFullPage 함수),
  카테고리만 'news'로 다르다. notice.js의 renderNoticeFullPage('news')가 id="notice-full-list"에
  '새 소식' 전체 목록을 채워 넣는다.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 라이트/다크 테마 FOUC(첫 렌더링 깜빡임) 방지: CSS가 로드되기 전에 즉시
       <html data-theme="light|dark">를 정해둔다. 저장된 값이 없으면(한 번도 토글을
       안 눌렀으면) 현재 시각 기준 자동값(오전 7시~밤 10시 전=라이트, 그 외=다크)을 쓴다.
       상세 로직/토글 클릭 처리는 theme.js 참고. -->
  <script>(function(){try{var t=localStorage.getItem('hbtTheme');if(t!=='light'&&t!=='dark'){var h=new Date().getHours();t=(h>=7&&h<22)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="../theme.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 소식 - 휴버대 티어표</title>
  <link rel="stylesheet" href="notice.css">
  <link rel="stylesheet" href="../Header_Footer.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="notice-page">
    <div class="notice-header">
      <h1 class="notice-title">
        <span class="notice-dot" style="background:#8b5cf6;"></span>
        새 소식
      </h1>
      <a href="notice.html" class="back-link">← 공지사항 메인으로</a>
    </div>

    <!-- notice.js renderNoticeFullPage('news')가 fetchNotices('news') 결과로 채움 -->
    <div id="notice-full-list" class="notice-full-list"></div>
    <div id="notice-pagination" class="pagination"></div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="../theme.js"></script>
  <script src="../common.js"></script>
  <!-- notice.js가 URL 경로/파일명(news.html)을 보고(detectPageType) 자동으로
       renderNoticeFullPage('news')를 실행한다 -->
  <script src="notice.js"></script>
</body>
</html>
