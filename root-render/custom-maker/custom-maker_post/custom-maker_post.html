<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 라이트/다크 테마 FOUC(첫 렌더링 깜빡임) 방지: CSS가 로드되기 전에 즉시
       <html data-theme="light|dark">를 정해둔다. 저장된 값이 없으면(한 번도 토글을
       안 눌렀으면) 현재 시각 기준 자동값(오전 7시~밤 10시 전=라이트, 그 외=다크)을 쓴다.
       상세 로직/토글 클릭 처리는 theme.js 참고. -->
  <script>(function(){try{var t=localStorage.getItem('hbtTheme');if(t!=='light'&&t!=='dark'){var h=new Date().getHours();t=(h>=7&&h<22)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="../../theme.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커스텀 티어 게시판 - Human Bug Tier</title>
  <link rel="icon" href="../../tier-media/tier-image/logo.webp" type="image/webp">

  <!-- 공통 CSS -->
  <link rel="stylesheet" href="custom-maker_post.css">
  <link rel="stylesheet" href="../../Header_Footer.css">

  <!-- 이 페이지 전용 레이아웃 스타일(게시판 카드 그리드/검색바). custom-maker_post.css로 옮기지 않고
       페이지 안에 그대로 남겨둔 초기 스타일 — 모바일 대응·상세 카드 스타일은 별도 .css 파일에서 확장함 -->
  <style>
    .board-container {
      max-width: 1750px;
      margin: 40px auto;
      padding: 0 20px;
    }
    
    .board-header {
      text-align: center;           /* ← 이 한 줄이 핵심 */
      margin-bottom: 30px;
    }

    .board-header h1 {
      font-size: 32px;
      color: #000000;
      margin: 0;
      font-weight: 700;
    }
    
    .eyes_icon {
      background-color: transparent #fff;
      width: 35px;
      height: 35px;
    }

    .board-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .board-controls input {
      flex: 1;
      padding: 10px;
      border: 2px solid #444;
      background: #1a1a1a;
      color: #fff;
      border-radius: 6px;
    }
    
    .board-controls button {
      padding: 10px 20px;
      background: #ffc400;
      color: #111;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    
    .board-table {
      width: 100%;
      border-collapse: collapse;
      background: #1f1f1f;
      border-radius: 8px;
      overflow: hidden;
    }
    
    .board-table th,
    .board-table td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    
    .board-table th {
      background: #2a2a2a;
      color: #ffcc00;
    }
    
    .board-table tr:hover {
      background: #2a2a2a;
    }
    
    .post-title {
      color: #fff;
      text-decoration: none;
    }
    
    .post-title:hover {
      color: #ffcc00;
    }
    
  </style>
</head>
<body>
  <!-- 헤더 (반드시 이 id로 작성) -->
  <div id="header-placeholder"></div>

  <main>
    <div class="board-container">
      <!-- ?mine=1(마이페이지에서 진입) 또는 ?author=닉네임(작성자별 보기)로 들어오면
           updateBoardHeader()가 부제목(board-subtitle)과 "전체 게시판" 복귀 버튼을 보여준다 -->
      <div class="board-header">
        <h1 id="board-title"><img src="../../tier-media/tier-image/human_bug_eyes_icon.gif" class="eyes_icon" alt=""> 커스텀 티어 게시판</h1>
        <p id="board-subtitle" class="board-subtitle" hidden></p>
      </div>

      <!-- 검색 + 글쓰기 영역: 검색창은 "제목 키워드" 또는 "@작성자" 형태를 함께 입력할 수 있고,
           custom-maker_post.js의 parseSearchForAuthor()가 @부분만 따로 뽑아 author 필터로 보낸다 -->
      <div class="board-controls">
        <input type="text" id="search-input" placeholder="제목 또는 @작성자 검색">
        <button type="button" onclick="searchPosts()">검색</button>
        <button type="button" id="view-all-board-btn" onclick="goAllPosts()" hidden>전체 게시판</button>
        <button type="button" onclick="goWritePage()">직접 만들기</button>
      </div>

      <!-- 기존 더미 카드 부분을 아래로 교체 -->
      <!-- 게시글 카드 그리드: loadPosts()가 fetchPosts() 결과로 이 안을 매번 새로 채운다 -->
      <div class="post-grid" id="post-grid"></div>
    </div>
  </main>

  <!-- 푸터 (반드시 이 id로 작성) -->
  <div id="footer-placeholder"></div>

  <!-- 공통 스크립트 + 게시판 전용 스크립트 -->
  <script src="../../theme.js"></script>
  <script src="../../common.js"></script>
  <script src="custom-maker_post.js"></script>
</body>
</html>
