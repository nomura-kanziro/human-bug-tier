<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 라이트/다크 테마 FOUC(첫 렌더링 깜빡임) 방지: CSS가 로드되기 전에 즉시
       <html data-theme="light|dark">를 정해둔다. 저장된 값이 없으면(한 번도 토글을
       안 눌렀으면) 현재 시각 기준 자동값(오전 7시~밤 10시 전=라이트, 그 외=다크)을 쓴다.
       상세 로직/토글 클릭 처리는 theme.js 참고. -->
  <script>(function(){try{var t=localStorage.getItem('hbtTheme');if(t!=='light'&&t!=='dark'){var h=new Date().getHours();t=(h>=7&&h<22)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../loading-screen.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게시글 수정 - 커스텀 티어</title>
  <link rel="icon" href="../tier-media/tier-image/logo.webp" type="image/webp">
  <link rel="stylesheet" href="../Header_Footer.css">
  <!-- custom-maker.css 그대로 재사용 (신규 제작 페이지와 100% 동일한 레이아웃/스타일) -->
  <link rel="stylesheet" href="custom-maker.css">
  <script src="../theme.js"></script>
  <script src="../loading-screen.js"></script>
  <script src="../common.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<!-- data-page="post-edit": custom-maker.js의 isPostEditPage()가 이 값을 보고
     "신규 제작(custom-maker.html)"이 아니라 "본인 글 전용 수정 페이지"임을 판단한다.
     같은 custom-maker.js를 공유하되, 이 플래그로 업로드 버튼 라벨/동작(POST→PUT)이 갈린다. -->
<body data-page="post-edit">

  <!-- 사이트 전체 초기 로딩 화면: 모든 리소스가 준비될 때까지 화면을 덮는 오버레이.
       모양은 loading-screen.css, 표시/숨김 타이밍은 loading-screen.js가 담당한다. -->
  <div class="site-loading-screen" id="site-loading-screen" role="status" aria-live="polite" aria-label="불러오는 중">
    <div class="site-loading-inner">
      <svg class="site-loading-svg" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="site-loading-track" cx="50" cy="50" r="37"></circle>
        <circle class="site-loading-track" cx="50" cy="50" r="30"></circle>
        <circle pathLength="360" class="site-loading-dash big" style="--sped:3.6s" cx="50" cy="50" r="37"></circle>
        <circle pathLength="360" class="site-loading-dash" style="--sped:2s" cx="50" cy="50" r="30"></circle>
      </svg>
      <img src="../tier-media/tier-image/logo.webp" alt="" class="site-loading-logo">
    </div>
    <p class="site-loading-text">불러오는 중…</p>
  </div>
  <div id="header-placeholder"></div>

  <div class="maker-container maker-container--edit">
    <h1 id="maker-page-title">
      <img src="../tier-media/tier-image/human_bug_eyes_icon.gif" class="eyes_icon" alt="">
      게시글 수정
    </h1>
    <p class="mobile-maker-help">
      게시된 티어표를 수정합니다. 모바일: 캐릭터를 <strong>탭</strong>해 선택한 뒤 티어 칸을 <strong>탭</strong>하세요.
    </p>
    <!-- custom-maker.js updateEditModeChrome()이 "「제목」 게시 티어표를 불러왔습니다..." 안내와
         상세 페이지로 돌아가는 링크를 여기 채워 넣는다 -->
    <div id="edit-mode-banner" class="edit-mode-banner" hidden></div>
    <div id="mobile-place-hint" class="mobile-place-hint" hidden></div>

    <div class="tier-nav">
      <button id="prev-btn" type="button">← 이전 티어</button>
      <h2 id="tier-title">1등급 - 신계 / 슈퍼 그랜드 마스터</h2>
      <button id="next-btn" type="button">다음 티어 →</button>
    </div>

    <div id="tier-capture-area">
      <div id="tier-list" class="tier-list"></div>
    </div>

    <div class="action-bar">
      <button id="reset-btn" class="btn btn-reset" type="button">
        <span class="btn-text">초기화</span>
        <span class="btn-icon">🗑️</span>
      </button>

      <div class="btn-dropdown">
        <button id="download-btn" class="btn btn-download" type="button">
          <span class="btn-text">다운로드</span>
          <span class="btn-icon">⬇️</span>
        </button>
        <div class="dropdown-menu" id="download-menu">
          <button class="dropdown-item" type="button" data-type="png">PNG로 저장</button>
          <button class="dropdown-item" type="button" data-type="pdf">PDF로 저장</button>
          <button class="dropdown-item" type="button" data-type="json">JSON으로 저장</button>
        </div>
      </div>

      <!-- 업로드가 아닌 수정 전용 -->
      <button id="upload-btn" class="btn btn-upload btn-edit-done" type="button">
        <span class="btn-text">수정완료</span>
        <span class="btn-icon">✓</span>
      </button>
    </div>

    <div class="character-pool" id="character-pool-wrap">
      <h3>📦 전체 캐릭터 풀 <span class="pool-hint-pc">(드래그해서 위로)</span><span class="pool-hint-mobile">(탭으로 선택)</span></h3>
      <div id="character-pool" class="characters-pool"></div>
    </div>
  </div>

  <div id="pool-viewport-arrows" class="pool-viewport-arrows" hidden>
    <button type="button" id="pool-max-up" class="pool-arrow pool-arrow--up" aria-label="티어표 테이블로 이동">▲</button>
    <button type="button" id="pool-max-down" class="pool-arrow pool-arrow--down" aria-label="전체 캐릭터 풀로 이동">▼</button>
  </div>

  <div id="footer-placeholder"></div>

  <script src="custom-maker.js"></script>
</body>
</html>
