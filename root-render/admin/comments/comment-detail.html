<!-- ========================================================
     comment-detail.html - 문의(댓글) 상세 관리 화면
     ========================================================
     comment-management.html 목록의 "📋 상세" 버튼에서 ?id=... 를 달고 진입한다.
     화면 자체는 <div id="comment-detail">만 두고, 실제 내용은 comment-detail.js가
     서버에서 받아온 데이터로 매번 innerHTML을 새로 그려 채운다(정적 마크업 없음).
     ======================================================== -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 라이트/다크 테마 FOUC(첫 렌더링 깜빡임) 방지: CSS가 로드되기 전에 즉시
       <html data-theme="light|dark">를 정해둔다. 저장된 값이 없으면(한 번도 토글을
       안 눌렀으면) 현재 시각 기준 자동값(오전 7시~밤 10시 전=라이트, 그 외=다크)을 쓴다.
       상세 로직/토글 클릭 처리는 theme.js 참고. -->
  <script>(function(){try{var t=localStorage.getItem('hbtTheme');if(t!=='light'&&t!=='dark'){var h=new Date().getHours();t=(h>=7&&h<22)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="../../theme.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>댓글 상세 관리 - 휴버대 티어표</title>
  <!-- 목록 화면과 톤을 맞추기 위해 comment-management.css를 그대로 재사용 -->
  <link rel="stylesheet" href="comment-management.css">
  <link rel="stylesheet" href="../../Header_Footer.css">
  <!-- 이 페이지에서만 필요한 상세 카드 레이아웃은 별도 파일 없이 인라인 <style>로 둠 -->
  <style>
    /* 페이지 전체 컨텐츠 폭 제한 + 중앙 정렬 (헤더/푸터는 각자 전체폭 사용) */
    .detail-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }
    /* 문의 원글을 담는 메인 카드. 굵은 테두리 + 우하단 그림자로 사이트 전반의
       "만화풍 카드" 디자인 톤을 맞춤 (comment-management.css의 admin-table과 톤 일치) */
    .detail-card {
      background: #fff;
      border: 4px solid #111;
      border-radius: 12px;
      box-shadow: 8px 8px 0 #111;
      padding: 30px;
      margin-bottom: 30px;
    }
    /* 답변 1개를 감싸는 카드. detail-card보다 테두리를 얇게(3px) + 그림자를 작게 해서
       원글보다 한 단계 낮은 시각적 위계를 준다 */
    .answer-card {
      margin-top: 25px;
      padding: 22px;
      border: 3px solid #111;
      border-radius: 12px;
      background: #fafafa;
      box-shadow: 6px 6px 0 #111;
    }
    /* 답변이 다른 글을 인용했을 때 보여주는 회색 인용 박스 */
    .quote {
      background: #f0f0f0;
      border: 3px solid #666;
      border-radius: 8px;
      padding: 16px;
      margin: 18px 0;
      font-size: 15px;
      line-height: 1.6;
    }
    /* 답변 카드 하단의 버튼(신고 아이콘 + 삭제 버튼) 가로 배치 영역 */
    .action-buttons {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* 다크 모드 — .detail-card/.quote는 검정 테두리+검정 오프셋 그림자(브루탈리즘 톤)라
       다크 배경에서는 그대로 두면 테두리·그림자가 페이지 배경에 묻혀 안 보이게 된다.
       그래서 var(--border-strong)로 밝혀서 카드 윤곽이 계속 보이게 한다.
       .answer-card는 theme.css의 전역 안전망(.answer-card 셀렉터)이 이미 처리해서 여기선 생략. */
    [data-theme="dark"] .detail-card {
      background: var(--bg-elevated);
      border-color: var(--border-strong);
      box-shadow: 8px 8px 0 var(--border-strong);
      color: var(--text-primary);
    }
    [data-theme="dark"] .quote {
      background: var(--bg-subtle);
      border-color: var(--border-color);
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <!-- common.js의 loadCommon()이 fetch로 header.html을 불러와 이 자리에 채워 넣음 -->
  <div id="header-placeholder"></div>

  <div class="detail-container">
    <h1 style="font-size: 28px; font-weight: 900; padding-bottom: 12px;">
      📋 댓글 상세 관리
    </h1>

    <!-- comment-detail.js의 renderCommentDetail()이 이 안을 통째로 채운다 (정적 마크업 없음) -->
    <div id="comment-detail"></div>
  </div>

  <!-- common.js의 loadCommon()이 footer.html을 불러와 이 자리에 채워 넣음 -->
  <div id="footer-placeholder"></div>

  <!-- 로드 순서: common.js(공통 유틸/헤더·푸터) → admin_api.js(관리자 토큰 헤더) →
       comment-detail.js(이 페이지의 실제 렌더링/삭제 로직) -->
  <script src="../../theme.js"></script>
  <script src="../../common.js"></script>
  <script src="../admin_api.js"></script>
  <script src="comment-detail.js"></script>
</body>
</html>
