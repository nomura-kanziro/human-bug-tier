<!-- ========================================================
     admin-login.html - 관리자 전용 로그인 화면
     ========================================================
     일반 유저 로그인(user_login/)과는 완전히 분리된 별도 페이지/별도 토큰 체계.
     이 화면에서 로그인에 성공하면 admin-login.js가 adminAuthToken을 저장하고
     comments/comment-management.html(관리자 대시보드)로 이동시킨다.
     ======================================================== -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 라이트/다크 테마 FOUC(첫 렌더링 깜빡임) 방지: CSS가 로드되기 전에 즉시
       <html data-theme="light|dark">를 정해둔다. 저장된 값이 없으면(한 번도 토글을
       안 눌렀으면) 현재 시각 기준 자동값(오전 7시~밤 10시 전=라이트, 그 외=다크)을 쓴다.
       상세 로직/토글 클릭 처리는 theme.js 참고. -->
  <script>(function(){try{var t=localStorage.getItem('hbtTheme');if(t!=='light'&&t!=='dark'){var h=new Date().getHours();t=(h>=7&&h<22)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../loading-screen.css">
  <meta charset="UTF-8" />
  <title>관리자 로그인</title>
  <link rel="stylesheet" href="admin-login.css" />
</head>
<body>


  <!-- 사이트 전체 초기 로딩 화면: 모든 리소스가 준비될 때까지 화면을 덮는 오버레이.
       모양은 loading-screen.css, 표시/숨김 타이밍은 loading-screen.js가 담당한다. -->
  <div class="site-loading-screen" id="site-loading-screen" role="status" aria-live="polite" aria-label="불러오는 중">
    <div class="site-loading-inner">
      <svg class="site-loading-svg" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="site-loading-track" cx="50" cy="50" r="37"></circle>
        <circle class="site-loading-track" cx="50" cy="50" r="30"></circle>
        <circle pathLength="360" class="site-loading-dash big" style="--sped:3.6s" cx="50" cy="50" r="37"></circle>
        <circle pathLength="360" class="site-loading-dash" style="--sped:2s" cx="50" cy="50" r="30"></circle>
      </svg>
      <img src="../tier-media/tier-image/logo.webp" alt="" class="site-loading-logo">
    </div>
    <p class="site-loading-text">불러오는 중…</p>
  </div>
  <!-- 공용 헤더(header.html)가 없는 단독 페이지라 우상단에 별도로 테마 토글을 띄운다.
       모양·동작은 header.html의 것과 완전히 동일(theme.css/theme.js 공용), 위치만 고정. -->
  <button type="button" class="theme-toggle-btn theme-toggle-floating" data-theme-toggle
          role="switch" aria-checked="false" aria-label="다크 모드 전환" title="화면 밝기 전환">
    <span class="theme-toggle-icon theme-toggle-icon-sun" aria-hidden="true">☀️</span>
    <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
    <span class="theme-toggle-icon theme-toggle-icon-moon" aria-hidden="true">🌙</span>
  </button>
  <!-- 좌상단 고정 로고: 클릭 시 goHome()으로 사이트 첫 화면(index.html)으로 이동 -->
  <div class="logo" onclick="goHome()">
      <img src="../tier-media/tier-image/logo.webp" alt="로고" class="logo-img">
      휴버대 티어표
  </div>

  <div class="login-wrapper">
    <!-- 왼쪽 로그인 영역: 아이디/비밀번호 입력 + 로그인 버튼 -->
    <div class="login-box">
      <h2 style="color:#000;">관리자 로그인</h2>

      <input type="text" id="adminId" placeholder="아이디" />
      <input type="password" id="adminPw" placeholder="비밀번호" />

      <!-- 클릭 시 admin-login.js의 login() 실행 → /api/admin/login 호출 -->
      <button onclick="login()">로그인</button>

      <!-- 돌아가기: goBack()으로 일반 홈(home.html) 이동 -->
      <div class="back-btn" onclick="goBack()">⟳</div>
    </div>

    <!-- 오른쪽 컬러 영역: 순수 장식용 색상 패널 (기능 없음) -->
    <div class="side-panel"></div>
  </div>

  <!-- 스크립트 로드 순서 중요: common.js(getBasePath 등 공통 유틸) →
       admin_api.js(관리자 토큰/헤더 유틸, getApiBase 자체 포함) → admin-login.js(로그인 로직) -->
  <script src="../theme.js"></script>
  <script src="../loading-screen.js"></script>
  <script src="../common.js"></script>
  <script src="admin_api.js"></script>
  <script src="admin-login.js"></script>
  <script>
    // admin-login.html 전용 스크립트
    // 좌상단 로고 클릭 시 이동할 위치. getBasePath가 아직 정의 안 됐을 때를 대비한 폴백('../') 포함.
    function goHome() {
      const base = (typeof getBasePath === 'function') ? getBasePath() : '../';
      window.location.href = base + 'index.html';
    }

    // 페이지 로드 시 로그인 상태 초기화 (필요시)
    // 현재는 콘솔 로그만 남기는 디버그용 훅. 향후 "이미 로그인된 관리자면 자동 이동" 등을
    // 여기에 추가할 수 있도록 로드 완료 시점을 표시해둔 것.
    window.addEventListener('load', () => {
      console.log('✅ admin-login.html 로드 완료 - 로그인 대기 중');
    });
  </script>
</body>
