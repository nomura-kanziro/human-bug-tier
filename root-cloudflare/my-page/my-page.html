<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 - 휴버대 티어표</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../Header_Footer.css">
  <link rel="stylesheet" href="my-page.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="my-page">
    <div class="my-page-header">
      <div class="my-page-avatar">
        <img id="my-page-avatar-img" src="" alt="프로필">
      </div>
      <div class="my-page-identity">
        <h1 id="my-page-nickname">사용자</h1>
        <p id="my-page-email"></p>
      </div>
    </div>

    <div class="my-page-stats">
      <div class="my-page-stat-card">
        <span class="my-page-stat-value" id="stat-post-count">-</span>
        <span class="my-page-stat-label">작성한 게시글</span>
      </div>
      <div class="my-page-stat-card">
        <span class="my-page-stat-value" id="stat-like-count">-</span>
        <span class="my-page-stat-label">받은 좋아요</span>
      </div>
      <div class="my-page-stat-card">
        <span class="my-page-stat-value" id="stat-draw-count">-</span>
        <span class="my-page-stat-label">행운 뽑기 횟수</span>
      </div>
      <div class="my-page-stat-card">
        <span class="my-page-stat-value" id="stat-best-tier">-</span>
        <span class="my-page-stat-label">최고 등급 당첨</span>
      </div>
      <div class="my-page-stat-card">
        <span class="my-page-stat-value" id="stat-points">-</span>
        <span class="my-page-stat-label">행운 포인트</span>
      </div>
    </div>

    <section class="my-page-section">
      <div class="my-page-section-header">
        <h2>내가 쓴 게시글</h2>
        <a id="my-page-board-link" href="#">전체 보기 →</a>
      </div>
      <div id="my-page-posts" class="my-page-post-list"></div>
    </section>

    <section class="my-page-section">
      <div class="my-page-section-header">
        <h2>최근 행운 뽑기 기록</h2>
        <a id="my-page-luck-link" href="#">행운 뽑기 하러 가기 →</a>
      </div>
      <div id="my-page-draws" class="my-page-draw-list"></div>
    </section>
  </div>

  <div id="footer-placeholder"></div>
  <script src="../common.js"></script>
  <script src="my-page.js"></script>
</body>
</html>
