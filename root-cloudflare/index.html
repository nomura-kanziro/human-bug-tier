<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 라이트/다크 테마 FOUC 방지: CSS·React 로드 전에 <html data-theme> 을 먼저 정한다.
       저장값(hbtTheme)이 없으면 시각 기준 자동값(07~22시 라이트, 그 외 다크). 상세는 src/lib/theme.js -->
  <script>(function(){try{var t=localStorage.getItem('hbtTheme');if(t!=='light'&&t!=='dark'){var h=new Date().getHours();t=(h>=7&&h<22)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>휴버대 티어표</title>
  <link rel="icon" href="/tier-media/tier-image/logo.webp" type="image/webp">
  <link rel="apple-touch-icon" href="/tier-media/tier-image/pwa/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
