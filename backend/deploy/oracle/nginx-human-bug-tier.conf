# nginx — 80 포트로 받아 로컬 Node(127.0.0.1:5000)로 넘긴다.
# 앞에 Cloudflare(DNS 프록시, 주황 구름)를 두면 HTTPS 는 Cloudflare 가 처리한다(SSL 모드: 처음엔 Flexible,
# 오리진 인증서를 붙이면 Full(strict) 권장 — README 참고). 도메인이 없으면 http://<공인IP>/ 로 바로 접속된다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 티어표 JSON 이 커질 수 있어 백엔드(express.json 2mb)보다 넉넉하게
    client_max_body_size 5m;

    # 에이전트 봇 실행(/api/ai/agent/run)은 글자가 나오는 대로 흘려보내는 스트림이다.
    # 모아서 한꺼번에 보내지 않게 버퍼링을 끄고, 느린 모델(CPU)도 끊기지 않게 대기 시간을 넉넉히 둔다.
    location = /api/ai/agent/run {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 330s;
    }

    # 정적 파일도 Node 가 서빙한다(SPA 폴백 포함) — nginx 는 전부 넘기기만 한다
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # backend/utils/getClientIp.js 가 x-forwarded-for 의 맨 앞 값을 실제 방문자 IP 로 쓴다(차단 기능)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
